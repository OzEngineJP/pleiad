# TestFlight に上げるための App ID・Push 通知の capability・App Store プロファイルを App Store Connect API で
# 整える（docs/ios.md「TestFlight への自動の配布」、mobile/scripts/asc-provision.mjs）。
#
# iOS の APNs 対応（ADR 0086）で通知拡張（NotifyService）が加わり、プロファイルは本体と拡張の 2 つ要る。
# 手動の起動（workflow_dispatch）でだけ動く。出来上がった .mobileprovision は成果物に上げるが、通常は
# ios-testflight.yml がビルドのたびに ASC API で名前（"Pleiad <bundle>"）で取り直すので Secrets に入れなくてよい
# （API が取れないときだけ IOS_PROVISION_PROFILE_BASE64・IOS_NSE_PROVISION_PROFILE_BASE64 に入れる）。
name: iOS provisioning
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-provision
  cancel-in-progress: false
jobs:
  provision:
    # ASC の Secrets は Environment「release」にだけ置く（ADR 0214）
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            [ -n "${!name}" ] || missing="$missing secrets.$name"
          done
          [ -z "$missing" ] || { echo "::error::Provisioning is not configured. Empty:$missing (docs/ios.md)"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Provision App IDs and profiles
        id: provision
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          bundle=$(node -p "require('./mobile/capacitor.config.json').appId")
          node mobile/scripts/asc-provision.mjs --bundle-id "$bundle" --out-dir "$RUNNER_TEMP/profiles"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-profiles
          path: ${{ runner.temp }}/profiles
          retention-days: 1
      - name: Summary
        run: |
          {
            echo "### iOS provisioning"
            echo
            echo "- App ID \`dev.pleiad.app\` (Push 通知付き) と \`dev.pleiad.app.notify\`（通知拡張）"
            echo "- App Store プロファイル \"Pleiad dev.pleiad.app\" / \"Pleiad dev.pleiad.app.notify\""
            echo "- TestFlight のビルドはプロファイルを毎回 ASC API から取る。代替として使いたければ成果物の"
            echo "  .mobileprovision を \`IOS_PROVISION_PROFILE_BASE64\`・\`IOS_NSE_PROVISION_PROFILE_BASE64\` へ"
            echo "- APNs の鍵（Token の通知に使う .p8）は Developer のサイトで人が作る（この API キーでは作れない。docs/ios.md）"
          } >> "$GITHUB_STEP_SUMMARY"
