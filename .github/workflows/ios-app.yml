# Capacitor の殻は Xcode 26 以上。remote-core 単体の Xcode 16.4 の試験は別に残す。
name: iOS app
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'tests/unit/ios-shell.mjs', '.github/workflows/ios-app.yml']
  pull_request:
    paths: ['mobile/**', 'tests/unit/ios-shell.mjs', '.github/workflows/ios-app.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'TestFlight にアップロードする（登録・署名の設定後）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npm run sync:ios
        working-directory: mobile
      - name: Build without signing
        run: >-
          xcodebuild build -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath mobile/ios/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Select an available iPad simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as f:
              devices = json.load(f)['devices']
          ipads = [d for runtime, ds in devices.items() if 'iOS-26' in runtime
                   for d in ds if d['isAvailable'] and 'iPad' in d['name']]
          if not ipads:
              raise SystemExit('No iOS 26 iPad simulator is available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IOS_SIMULATOR_ID=' + ipads[0]['udid'] + '\n')
          PY
      # 署名しないと試験の宿主に entitlement が付かず、Keychain が -34018（errSecMissingEntitlement）で断る。
      # シミュレーターは ad-hoc の署名（-）で足り、Team も証明書も要らない
      - name: Test the shell bridge and Keychain on iPad Simulator
        run: >-
          xcodebuild test -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          -derivedDataPath mobile/ios/DerivedData -resultBundlePath mobile/ios/App/build/tests.xcresult
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
  credentials:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    # 署名・ストアの Secrets は Environment「release」にだけ置く（main と v* のタグからしか使えない。ADR 0214）
    environment: release
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        name: Skip distribution when secrets are missing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          for name in IOS_TEAM_ID IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROVISION_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo '署名・配布の secrets が未設定のため TestFlight をスキップします。' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"
  testflight:
    needs: [simulator, credentials]
    if: needs.credentials.outputs.ready == 'true'
    # 署名・ストアの Secrets は Environment「release」にだけ置く（main と v* のタグからしか使えない。ADR 0214）
    environment: release
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm run sync:ios
        working-directory: mobile
      - name: Archive and upload to TestFlight
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: bash mobile/scripts/ios-testflight.sh
