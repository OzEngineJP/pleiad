# Capacitor の殻は Xcode 26 以上。remote-core 単体の Xcode 16.4 の試験は別に残す。
# TestFlight への配布は ios-testflight.yml（このワークフローを workflow_call で呼んで試験を通してから上げる）。
name: iOS app
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'tests/unit/ios-shell.mjs', '.github/workflows/ios-app.yml']
  pull_request:
    paths: ['mobile/**', 'tests/unit/ios-shell.mjs', '.github/workflows/ios-app.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# 呼び出し（workflow_call）では github.workflow が呼び出し元の名前になり、単独の実行と同じ組で待ち合わない
concurrency:
  group: ios-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: xcodebuild -version
      - run: npm ci
        working-directory: mobile
      - run: npm run sync:ios
        working-directory: mobile
      - name: Build without signing
        run: >-
          xcodebuild build -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath mobile/ios/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Select an available iPad simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as f:
              devices = json.load(f)['devices']
          ipads = [d for runtime, ds in devices.items() if 'iOS-26' in runtime
                   for d in ds if d['isAvailable'] and 'iPad' in d['name']]
          if not ipads:
              raise SystemExit('No iOS 26 iPad simulator is available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IOS_SIMULATOR_ID=' + ipads[0]['udid'] + '\n')
          PY
      # 署名しないと試験の宿主に entitlement が付かず、Keychain が -34018（errSecMissingEntitlement）で断る。
      # シミュレーターは ad-hoc の署名（-）で足り、Team も証明書も要らない
      - name: Test the shell bridge and Keychain on iPad Simulator
        run: >-
          xcodebuild test -project mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          -derivedDataPath mobile/ios/DerivedData -resultBundlePath mobile/ios/App/build/tests.xcresult
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
