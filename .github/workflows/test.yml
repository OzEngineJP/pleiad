# LLM を呼ばないテストだけを回す。
# サーバを立てて実際に LLM を呼ぶ側（npm run test:e2e）は認証と使用量が要るので、ここでは回さない。
name: test

on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_dispatch:
  # 押すたびには回さない検査（下の safe-storage-macos）を、週に一度だけ拾う
  schedule:
    - cron: '17 21 * * 0'

permissions:
  contents: read

# PR は、同じ PR に続けて押したときに古い実行を止める（見たいのは先端の状態だけ）。
# main への push は止めない: タグを打った commit の run が後の push で取り消されると、リリースの ci-gate が CI の結果を使えず、
# release の中で全部のテストを回し直す（約 28 分。docs/release-ci-reuse.md）。cancel-in-progress を切るだけでは、同じ group の待ちの run が
# 次の push で取り消されるので、push・手動の group は commit ごとに分ける（commit 同士は待たせず並べて回す）。
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 全部の suite を、重みで割った shard ごとのジョブに分けて並べる（tests/run.mjs --shard。重みは OS ごとの tests/suite-weights.<win32|linux>.json）。
  # 同じ (os, node) の shard は、1..shards が欠けず揃っていること（tests/unit/release-ci-gate.mjs が突き合わせる）。
  test:
    # 週次の起動は safe-storage-macos のためだけ。同じ main をもう一度回さない
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # (os, node) は 3 本（直積の 4 本から Windows の node 24 を外した）。Windows の実行枠は 2 倍で計上されるので、1 本あたりの費用は ubuntu の約 4 倍になる。
        # shard の数は、重みの合計（Windows 約 61 分・ubuntu 約 33 分。worker 2 本）から、1 ジョブが 5〜8 分になるように決めた。
        include:
          # 下限（engines の node>=22.16。node:sqlite の FTS5 が使える最初の版。ADR 0115・0349）と最新。プラットフォーム非依存の壊れ方は実績上ここで捕まる
          - { os: ubuntu-latest, node: "22.16", shard: 1, shards: 2 }
          - { os: ubuntu-latest, node: "22.16", shard: 2, shards: 2 }
          - { os: ubuntu-latest, node: "24", shard: 1, shards: 2 }
          - { os: ubuntu-latest, node: "24", shard: 2, shards: 2 }
          # Windows は (os, node) を 1 本だけ残す。Windows 固有の経路（パス・ファイルの掴み合い・疑似端末など）を
          # main の push と PR で自動で通すのはこのジョブだけ（evaluation-release.yml も Windows で npm test を回すが、
          # 発火はリリースのタグ v* のみ）。
          # node 24 ではなく下限（22.16）を残す理由: リリースは node 22、開発機は node 24 なので、
          # 下限 × Windows はここを外すとどこでも検証されなくなる。
          # 直近30日の Windows 固有の失敗 4 件は node の版と相関していない（20 が 3、24 が 2）。
          - { os: windows-latest, node: "22.16", shard: 1, shards: 6 }
          - { os: windows-latest, node: "22.16", shard: 2, shards: 6 }
          - { os: windows-latest, node: "22.16", shard: 3, shards: 6 }
          - { os: windows-latest, node: "22.16", shard: 4, shards: 6 }
          - { os: windows-latest, node: "22.16", shard: 5, shards: 6 }
          - { os: windows-latest, node: "22.16", shard: 6, shards: 6 }
    name: test (${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # 1 shard は worker 2 本で Windows が 5〜8 分・ubuntu が 8 分ほど。止まったときに枠を占有し続けないための上限
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 本物の Electron を起こす検査は Windows の 1 本目の shard だけで回す（npm test の suite は Electron の実体を使わない）
      - name: Prepare verified Electron
        if: matrix.os == 'windows-latest' && matrix.shard == 1
        run: node scripts/prepare-electron.mjs
      - name: Source UI startup smoke
        if: matrix.os == 'windows-latest' && matrix.shard == 1
        timeout-minutes: 5
        run: node scripts/release-ui-smoke.mjs --source
      # 共有ランナーでは worker 2 本に固定する（ローカルの CPU 数に応じた既定値は使わない）。
      # npm test を通さず直に呼ぶ。Windows の既定の shell（pwsh）は `npm test -- --jobs 2` の `--` を食べ、
      # npm が --jobs を自分の設定として取るので、tests/run.mjs には `2 temporary/…` だけが suite 名として届いて落ちる（0.8.0 で起きた）
      # --retry-failed 1: 落ちた suite だけを新しい worker で 1 回流し直し、通れば緑にする（Windows の負荷で時々 1 本だけ落ちる試験を、リリースの足止めにしない。
      # 手元の npm test は流し直さない）。流し直したら、警告の注釈とジョブのまとめに、どの suite が 1 回目に落ちたかが必ず残る。2 回目も落ちたら赤（docs/adr/0162）
      - run: node tests/run.mjs --jobs 2 --retry-failed 1 --shard ${{ matrix.shard }}/${{ matrix.shards }} --timings temporary/test-timings.json
      # suite ごとの時間・判定数・skip の記録（tests/run.mjs --timings）だけを残す。ログや環境変数・トークンは上げない。
      # 落ちた実行でも残し（always）、npm test が引数の不正などで書けなかったときは警告だけ（失敗にしない）
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-timings-${{ matrix.os }}-node${{ matrix.node }}-shard${{ matrix.shard }}
          path: temporary/test-timings.json
          if-no-files-found: warn
          retention-days: 30

  # 外部 MCP の秘密の暗号化を、本物の Electron の safeStorage で確かめる（tests/desktop/safe-storage-smoke.cjs）。
  # main ↔ utilityProcess の橋渡し（desktop/secret-bridge.cjs）を通して暗号化・復号が往復するか、
  # 暗号化できない環境（Linux で鍵束が無い = basic_text）では平文に切り替えて理由を出すかを見る。ウィンドウは出さない。
  safe-storage:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS の鍵束はリリース時と週次・手動の safe-storage-macos で確かめる。
          - { os: windows-latest, name: windows-dpapi, expect: "1" }
          - { os: ubuntu-latest, name: linux-gnome-keyring, keyring: true, expect: "1" }
          - { os: ubuntu-latest, name: linux-no-keyring, keyring: false, expect: "0" }
    name: safe-storage (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 鍵束や D-Bus が常駐して終わらなくなったときに、実行枠を占有し続けないための上限
    timeout-minutes: 15
    env:
      SMOKE_EXPECT_ENCRYPTED: ${{ matrix.expect }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prepare verified Electron
        run: node scripts/prepare-electron.mjs
      - if: runner.os != 'Linux'
        run: npm run test:safe-storage
      - name: Install xvfb and gnome-keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0
      # 鍵束あり: D-Bus のセッションで gnome-keyring を空のパスワードで解錠し、libsecret を使わせる。
      # 解錠の途中で gcr の確認画面が立ち上がるため、xvfb は鍵束ごと外側で包む（内側だと「cannot open display」で解錠に失敗する）
      - name: Smoke (gnome-keyring)
        if: runner.os == 'Linux' && matrix.keyring
        run: |
          # 既定のキーリングを空のパスワードで先に作る。無いと解錠の途中で gcr の確認画面が出て、
          # 画面があると待ち続け、画面が無いと解錠に失敗する（どちらでもこの検査は終わらない）
          mkdir -p ~/.local/share/keyrings
          printf '[keyring]\ndisplay-name=Default keyring\nctime=0\nmtime=0\nlock-on-idle=false\nlock-after=false\n' \
            > ~/.local/share/keyrings/Default_keyring.keyring
          printf 'Default_keyring' > ~/.local/share/keyrings/default
          xvfb-run -a dbus-run-session -- sh -c '
            echo -n "" | gnome-keyring-daemon --unlock --replace --daemonize --components=secrets > /dev/null
            npx electron --no-sandbox --password-store=gnome-libsecret tests/desktop/safe-storage-smoke.cjs
            status=$?; pkill -x gnome-keyring-daemon || true; exit $status'
          # 止めるのは鍵束だけ。-f だと、同じ文字列を含むこの sh 自身も一緒に殺してしまう（exit 143）
      # 鍵束なし: D-Bus も鍵束も無い。safeStorage は basic_text に落ちるので、Pleiad は「暗号化できない」と判定するはず
      - name: Smoke (no keyring)
        if: runner.os == 'Linux' && !matrix.keyring
        run: xvfb-run -a npx electron --no-sandbox tests/desktop/safe-storage-smoke.cjs

  # push で回るジョブが全部通ったことを、1 つの名前にまとめる。リリースの ci-gate（scripts/release-ci-gate.mjs）が必須とするのはこのジョブだけで、
  # shard の数や matrix を変えても ci-gate は直さなくてよい。`needs` が全部 success のときだけ走るので、落ちた・飛ばされた shard があればこのジョブは走らない。
  # needs の一覧は、push で回るほかのジョブ全部と一致させる（tests/unit/release-ci-gate.mjs が突き合わせる）
  test-summary:
    needs: [test, safe-storage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "test と safe-storage の全部のジョブが通った"

  # macOS の Keychain 側。リリース時の検査に加え、週次と手動でも確かめる。
  safe-storage-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SMOKE_EXPECT_ENCRYPTED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prepare verified Electron
        run: node scripts/prepare-electron.mjs
      - run: npm run test:safe-storage
