name: Desktop signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (v0.1.0 or v0.2.0-beta.1)
        required: true
        type: string
      platforms:
        description: Platforms to sign and release
        required: true
        type: choice
        default: windows
        options: [windows, all]
      rollout:
        description: Initial rollout percentage (0-100)
        default: '10'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  package:
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'windows' && '["windows-latest"]' || '["windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PLY_WINDOWS_SIGNING: ${{ vars.PLY_WINDOWS_SIGNING || 'pfx' }}
      PLY_WIN_PUBLISHER: ${{ vars.PLY_WIN_PUBLISHER }}
      PLY_WIN_CERTIFICATE_SHA1: ${{ vars.PLY_WIN_CERTIFICATE_SHA1 }}
      PLY_AZURE_ENDPOINT: ${{ vars.PLY_AZURE_ENDPOINT }}
      PLY_AZURE_ACCOUNT: ${{ vars.PLY_AZURE_ACCOUNT }}
      PLY_AZURE_PROFILE: ${{ vars.PLY_AZURE_PROFILE }}
      # PLY_WINDOWS_SIGNING=none（無署名。ADR 0209）では、Windows に署名の秘密を渡さない（scripts/release-signing.cjs は渡されると止まる）
      AZURE_TENANT_ID: ${{ matrix.os == 'windows-latest' && vars.PLY_WINDOWS_SIGNING != 'none' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ matrix.os == 'windows-latest' && vars.PLY_WINDOWS_SIGNING != 'none' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_CLIENT_SECRET: ${{ matrix.os == 'windows-latest' && vars.PLY_WINDOWS_SIGNING != 'none' && secrets.AZURE_CLIENT_SECRET || '' }}
      CSC_LINK: ${{ (matrix.os == 'windows-latest' && vars.PLY_WINDOWS_SIGNING != 'none' && secrets.WIN_CSC_LINK) || (matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK) || '' }}
      CSC_KEY_PASSWORD: ${{ (matrix.os == 'windows-latest' && vars.PLY_WINDOWS_SIGNING != 'none' && secrets.WIN_CSC_KEY_PASSWORD) || (matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD) || '' }}
      APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # koffi（computer use の Win32 呼び出し）のネイティブ本体は @koromix/koffi-<os>-<cpu> という別のパッケージで、
      # npm ci はこの runner（x64）の分しか入れない。arm64 のインストーラーにも入れるため、arm64 の本体を足す。
      # --force は os / cpu の検査を外す（他の OS の本体は増えず、package.json とロックも変わらない）。版は koffi 本体に合わせる
      - name: Add koffi native binary for Windows arm64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $koffi = (Get-Content -LiteralPath node_modules/koffi/package.json -Raw | ConvertFrom-Json).version
          npm install --no-save --force "@koromix/koffi-win32-arm64@$koffi"
          if ($LASTEXITCODE -ne 0) { throw 'koffi win32-arm64 install failed' }
          foreach ($arch in 'x64', 'arm64') {
            if (!(Test-Path -LiteralPath "node_modules/@koromix/koffi-win32-$arch/win32_$arch/koffi.node")) { throw "Missing koffi binary for win32-$arch" }
          }
      - name: Validate source version and signing configuration
        run: node scripts/release-preflight.mjs
      # 手元の版が無署名を受け入れる版（橋渡しの版）が届いていないと止める（ADR 0209）
      - name: Check that installed versions accept unsigned updates
        if: runner.os == 'Windows' && env.PLY_WINDOWS_SIGNING == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-unsigned-guard.mjs
      - run: node tests/run.mjs --jobs 2
      - run: npm run desktop:dist -- --config electron-builder.release.cjs --publish never
      - name: Verify Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist-desktop -Filter *.exe)
          $apps = @(Get-ChildItem dist-desktop -Recurse -Filter Ply.exe)
          if ($installers.Count -eq 0 -or $apps.Count -lt 2) { throw 'Missing Windows installer or architecture' }
          foreach ($artifact in ($installers + $apps)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName
            if ($env:PLY_WINDOWS_SIGNING -eq 'none') {
              if ($signature.Status -ne 'NotSigned') { throw "Unexpected signature on an unsigned build: $($artifact.Name)" }
              continue
            }
            if ($signature.Status -ne 'Valid') { throw 'Invalid Windows signature' }
            if ($signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -cne $env:PLY_WIN_PUBLISHER) { throw 'Unexpected signing publisher' }
          }
      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        run: |
          count=0
          while IFS= read -r -d '' bundle; do
            codesign --verify --deep --strict "$bundle"
            xcrun stapler validate "$bundle"
            count=$((count + 1))
          done < <(find dist-desktop -maxdepth 2 -name '*.app' -print0)
          test "$count" -ge 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.blockmap
            dist-desktop/beta*.yml
            dist-desktop/latest*.yml
  draft:
    needs: package
    runs-on: ubuntu-latest
    environment: desktop-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      ROLLOUT: ${{ inputs.rollout }}
      RELEASE_PLATFORMS: ${{ inputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:prepare
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and create draft
        run: |
          node scripts/release-artifacts.mjs release-assets "${RELEASE_TAG#v}" "$ROLLOUT" temporary/release-notes.md "$RELEASE_PLATFORMS"
          node scripts/release-publish.mjs draft release-assets
