# Android の署名済み APK を、main への push で Android に効く変更があったときに GitHub Release へ出す
# （docs/android-releases.md、ADR 0066）。新しい版を出したら、同じコミットの AAB を Google Play の
# 内部テストへ上げてすぐ公開する（android-play.yml を呼ぶ。docs/android-releases.md「Google Play」）。
#
# デスクトップの更新とは干渉しない:
# - デスクトップの自動更新（desktop/update-auth.cjs の newestRelease）はタグから `v` を外して
#   semver として有効なものだけを見る。`android-v…` は無効なので無視される。
# - stable は releases/latest を見るので、ここのリリースは `--latest=false` が必須。
name: Android release
on:
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - 'mobile/www/**'
      - 'mobile/capacitor.config.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - '.github/workflows/android-release.yml'
      - '!mobile/android/**/src/test/**'
      - '!mobile/android/**/src/androidTest/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # 署名・ストアの Secrets は Environment「release」にだけ置く（main と v* のタグからしか使えない。ADR 0214）
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle*
            mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      # InteropTest（remote-core）は mobile/scripts/fake-host.mjs で本物の relay と core のサーバーを起こすので、
      # ルートの依存も要る。Electron の本体は使わないので落とさない。
      - name: Install root dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Install and sync
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: JVM tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :remote-core:test
      - name: Decide version
        id: version
        run: |
          code=$(git rev-list --count HEAD)
          base=$(node -p "require('./mobile/package.json').version")
          name="${base}-${code}"
          tag="android-v${name}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null || gh release view "$tag" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$tag already exists (versionCode $code is already released); nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag (versionCode $code, versionName $name)"
          fi
      - name: Restore signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PLY_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLY_ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ vars.PLY_ANDROID_CERT_SHA256 }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing secrets.PLY_ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing secrets.PLY_ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing secrets.PLY_ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing secrets.PLY_ANDROID_KEY_PASSWORD"
          [ -n "$CERT_SHA256" ] || missing="$missing vars.PLY_ANDROID_CERT_SHA256"
          if [ -n "$missing" ]; then
            echo "::error::Android signing is not configured. Empty:$missing (docs/android-releases.md)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pleiad-android.p12"
          echo "PLY_ANDROID_KEYSTORE=$RUNNER_TEMP/pleiad-android.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.version.outputs.skip != 'true'
        working-directory: mobile/android
        env:
          PLY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLY_ANDROID_KEYSTORE_PASSWORD }}
          PLY_ANDROID_KEY_ALIAS: ${{ secrets.PLY_ANDROID_KEY_ALIAS }}
          PLY_ANDROID_KEY_PASSWORD: ${{ secrets.PLY_ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PplyVersionCode=${{ steps.version.outputs.code }}
          -PplyVersionName=${{ steps.version.outputs.name }}
      - name: Verify signature
        if: steps.version.outputs.skip != 'true'
        env:
          EXPECTED_SHA256: ${{ vars.PLY_ANDROID_CERT_SHA256 }}
        run: |
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::$apk was not built (unsigned?)"; exit 1; }
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          norm() { printf '%s' "$1" | tr -d ': \r\n' | tr 'a-f' 'A-F'; }
          actual=$(norm "$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | sed 's/.*: //')")
          expected=$(norm "$EXPECTED_SHA256")
          if [ -z "$expected" ]; then
            echo "::error::vars.PLY_ANDROID_CERT_SHA256 is empty"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate mismatch: got $actual, expected $expected"
            exit 1
          fi
      - name: Create release
        id: publish
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$out/Pleiad-Android-$VERSION_NAME.apk"
          (cd "$out" && sha256sum "Pleiad-Android-$VERSION_NAME.apk" > SHA256SUMS.txt)
          cat > "$RUNNER_TEMP/notes.md" <<'EOF'
          Pleiad の Android 版です。

          - APK を端末で開いてインストールしてください。初回は「提供元不明のアプリ」のインストール許可が必要です。
          - すでに入っている版の上から、そのまま更新できます。
          - 対応は Android 13 以上です。
          EOF
          gh release create "$TAG" "$out/Pleiad-Android-$VERSION_NAME.apk" "$out/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Pleiad Android $VERSION_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released=true" >> "$GITHUB_OUTPUT"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pleiad-android.p12"
  # 新しい版を出したときだけ、同じコミットの AAB を Play の内部テストへ上げてすぐ公開する。
  # 版がもうある（skip）ときは上げない（同じ versionCode は Play が二度と受け取らない）
  play:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/android-play.yml
    with:
      track: internal
      status: completed
    secrets: inherit
