appId: jp.ply.desktop
productName: Pleiad
artifactName: Pleiad-${version}-${os}-${arch}.${ext}
asar: false
# agent-browser の同梱と、無停止の更新の実行場所の材料（公式の Node・manifest。docs/zero-downtime-update/design.md §3）。順番は scripts/after-pack.cjs
beforePack: ./scripts/build-computer-mac.cjs
afterPack: ./scripts/after-pack.cjs
# node-pty は N-API の prebuild（win32 / darwin の x64・arm64）をそのまま Electron で読む。
# 既定の npmRebuild はソースからビルドし直して build/Release に置き（prebuild より先に読まれる）、
# x64 の runner で arm64 をクロスビルドすることになるので止める。ほかの本番依存に再ビルドの要る native モジュールは無い
npmRebuild: false
# koffi の .node は asar の外に置く（今は asar: false で全部が展開済みだが、asar を有効にしても読めるように）
asarUnpack:
  - node_modules/koffi/**/*.node
  - node_modules/@koromix/**/*.node
directories:
  output: dist-desktop
files:
  - desktop/**
  - "!desktop/computer/mac/**"
  - core/**
  # pleiad CLI（bin/pleiad.mjs）と起動口（pleiad.cmd・pleiad）。Ply の内蔵 Node で走らせる（ADR 0090）
  - bin/**
  - web/**
  - skills/visualize/**
  - package.json
  - "!node_modules/agent-browser/bin/**"
  # Claude Code の実行ファイル（SDK の optionalDependencies の @anthropic-ai/claude-agent-sdk-<os>-<arch>。win32-x64 で約 238MB）は入れない。
  # Pleiad は query() に必ず pathToClaudeCodeExecutable（利用者が入れた claude。core/cli-installation.mjs の claudeExecutable）を渡し、同梱版は読まない
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"
  # Claude Agent SDK 本体も入れない（Anthropic の独自ライセンス。インストーラーは OSI のライセンスのものだけにする。ADR 0208）。
  # devDependencies なので electron-builder は元から入れないが、依存の向きが変わっても入らないように明示する。
  # 配布物は初めて要るときに npm から取る（core/claude-sdk.mjs）。tests/unit/claude-sdk-pin.mjs がこの行を確かめる
  - "!node_modules/@anthropic-ai/claude-agent-sdk/**"
  # node-pty のソース・デバッグ情報・使わない ConPTY の DLL は入れない
  - "!node_modules/node-pty/{src,deps,scripts,third_party,typings}/**"
  - "!node_modules/node-pty/**/*.pdb"
  - "!node_modules/node-pty/binding.gyp"
  # 手元の npm install が置く build/Release/conpty（ビルド機のアーキテクチャの ConPTY DLL）も使わない。読むのは prebuilds だけ
  - "!node_modules/node-pty/build/**"
  # koffi（computer use の Win32 呼び出し）のネイティブ本体は node_modules/@koromix/koffi-<os>-<arch>/ にある。
  # ビルド機の OS・CPU の分だけが npm ci で入るので、ほかの構成の分は元から入らない
  # koffi のビルド用の C++ のソース・ヘッダー・文書は実行に要らない。src/koffi/src は実行時に読む JS（static.cjs）なので残す
  - "!node_modules/koffi/{doc,vendor,lib}/**"
win:
  icon: desktop/icon.ico
  # 表示名は Pleiad だが、実行ファイルは改名前の Ply.exe のまま置く。
  # NSIS は「$INSTDIR\<実行ファイル>」が在るときだけ既存のショートカットを残して新しい名前へ付け替える（KeepShortcuts）。
  # 名前を変えると改名前からの更新でショートカットが作り直され、タスクバーのピン留め（Ply.exe を指す）が切れる。
  # 入れ先（レジストリの InstallLocation）・アンインストール情報（appId 由来の GUID）・userData（package.json の name）は元から名前に依らない
  executableName: Ply
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
mac:
  extraFiles:
    - from: desktop/computer/mac/dist/pleiad-computer-helper
      to: Helpers/pleiad-computer-helper
  binaries:
    - Contents/Helpers/pleiad-computer-helper
  icon: desktop/icon.icns
  category: public.app-category.productivity
  # 通話モード（docs/voice-call.md）のマイク。説明文と、署名・公証した版の entitlement（audio-input）。Mac の実機では確かめていない
  extendInfo:
    NSMicrophoneUsageDescription: Pleiad uses the microphone only during a voice call you start, to talk to your agent.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
