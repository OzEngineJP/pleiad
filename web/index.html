<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: スマホの切り欠き・ホームバーの下まで描き、余白は env(safe-area-inset-*) で取る（style.css「狭い画面・タッチ」）。
     interactive-widget=resizes-content: キーボードが出たら画面の高さを縮め、入力欄をキーボードの上に残す（Android の Chrome） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Pleiad</title>
<!-- 配ったサーバーの版（<版>+<ビルド>）。サーバーが埋める。ready の版と違えば 1 回だけ読み直す（web/interrupt.mjs の versionReload） -->
<meta name="pleiad-build" content="">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/tools.css">
<link rel="stylesheet" href="/tree.css">
<link rel="stylesheet" href="/context.css">
<link rel="stylesheet" href="/manage-panel.css">
<link rel="stylesheet" href="/updates.css">
<link rel="stylesheet" href="/usage.css">
<link rel="stylesheet" href="/file-preview.css">
<link rel="stylesheet" href="/compaction.css">
<link rel="stylesheet" href="/conversation-nav.css">
<link rel="stylesheet" href="/remote-browser.css">
<link rel="stylesheet" href="/computer-settings.css">
<link rel="stylesheet" href="/notify-settings.css">
<link rel="stylesheet" href="/notification-inbox.css">
<link rel="stylesheet" href="/git.css">
<link rel="stylesheet" href="/chrome-panel.css">
<link rel="stylesheet" href="/worktree.css">
<link rel="stylesheet" href="/chrome-control.css">
<link rel="stylesheet" href="/channels-side.css">
<link rel="stylesheet" href="/channels-feed.css">
<link rel="stylesheet" href="/channels-thread.css">
<link rel="stylesheet" href="/bot-page.css">
<link rel="stylesheet" href="/routines.css">
<link rel="stylesheet" href="/voice.css">
<link rel="stylesheet" href="/api-keys.css">
<!-- i18next はビルドしないので、裸の名前をサーバーの配信口へ向ける（core/server.mjs の /vendor/i18next.mjs）。モジュールより前に置く -->
<script type="importmap">{ "imports": { "i18next": "/vendor/i18next.mjs" } }</script>
<!-- 最初の描画より前に、配色・言語・窓の枠（デスクトップ版だけ）・脇の開閉を決める。client.mjs を待つと一瞬ずれて見える。
     言語の正本はサーバー（ready で届く）。ここは前回の写し。違えば client.mjs が写しを直して読み直す -->
<script>
{
  const root = document.documentElement, desk = window.plyDesktop;
  try {
    const lang = localStorage.getItem('agent-host-lang');
    if (lang === 'ja' || lang === 'en') root.lang = lang;
    const theme = localStorage.getItem('agent-host-theme');
    if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
    if (localStorage.getItem('agent-host-sidebar') === 'closed') root.classList.add('side-closed');
  } catch {}
  if (desk) root.classList.add('desktop', desk.platform === 'darwin' ? 'mac' : 'overlay');
  // リモートの窓（desktop/remote-preload.cjs の plyRemote）。帯にホスト名のバッジを置き、タイトル行を帯に上げる（web/remote-badge.mjs）
  if (window.plyRemote) root.classList.add('remote');
  // モバイル版の殻（docs/remote.md §8.2）。700px 以下はタイトルの下にホスト名、広い幅は帯にホスト名（web/remote-badge.mjs）
  if (window.plyRemote?.shell === 'mobile') root.classList.add('remote-mobile');
}
</script>
</head>
<body>
  <!-- デスクトップ版の窓の上端。掴んで窓を動かす帯で、脇と同じ面。ブラウザでは出ない -->
  <div class="titlebar" aria-hidden="true"></div>
  <!-- ==================== 脇のパネル（セッション一覧、web/side.mjs） ==================== -->
  <aside id="sidebar">
    <header>
      <div class="brand" role="img" aria-label="Pleiad">
        <svg class="brand-icon" viewBox="0 0 96 96" aria-hidden="true"><use href="/brand/pleiad-icon.svg#mark"/></svg>
        <svg class="brand-wordmark" viewBox="0 0 346 104" aria-hidden="true"><use href="/brand/pleiad-wordmark.svg#wordmark"/></svg>
      </div>
      <!-- 設定を開いている間だけ、ロゴの位置に出る。Esc でも会話へ戻る -->
      <button type="button" class="btn back-chat" id="backToChat"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="app.backToChat"></span></button>
      <!-- 通知ボタン（web/notification-inbox.mjs）。名前（aria-label）と右上の件数は未読に合わせて書く -->
      <button type="button" class="btn btn-icon" id="notifBell" aria-controls="notifPanel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
      <button type="button" class="btn btn-icon" id="newSession" data-i18n-title="app.newSessionTitle"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="btn btn-icon" id="settings" data-i18n-title="app.settings" data-i18n-aria-label="app.settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.5 2a8 8 0 0 0-1.5.9l-2-.6-2.5 4.4 1.5 1.4a8 8 0 0 0 0 1.8L3 14.3l2.5 4.4 2-.6A8 8 0 0 0 9 19l.5 2h5l.5-2a8 8 0 0 0 1.5-.9l2 .6 2.5-4.4-1.5-1.4a8 8 0 0 0 0-1.8L21 9.7l-2.5-4.4-2 .6A8 8 0 0 0 15 5l-.5-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button type="button" class="btn btn-icon side-toggle" id="closeSidebar" data-shortcut="B" data-i18n-title="app.closeSidebarTitle" data-i18n-aria-label="app.closeSidebar" aria-controls="sidebar" aria-keyshortcuts="Control+B"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9.5 4v16"/></svg></button>
    </header>
    <div class="search">
      <!-- 題・状態・場所と会話の本文を探す（web/side.mjs）。語があるときは下の一覧が結果の listbox になる。Ctrl+Shift+F（macOS は ⌘⇧F）でどこからでも入れる -->
      <div class="qbox">
        <input type="search" id="q" data-i18n-placeholder="app.search" data-i18n-aria-label="app.search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="groups" aria-autocomplete="list">
        <button type="button" class="qclear" id="qClear" hidden tabindex="-1" data-i18n-title="sidebar.search.clear" data-i18n-aria-label="sidebar.search.clear"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button type="button" class="btn btn-icon" id="filterBtn" data-i18n-title="app.filterTitle"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"/></svg></button>
      <div class="pop" id="filterPop" hidden></div>
      <div class="pop recent" id="recentPop" role="listbox" data-i18n-aria-label="sidebar.search.recent" hidden></div>
    </div>
    <!-- 脇の並べ方（docs/design-system.md「脇」）。同じスレッドを「チャンネル」（一時チャット・チャンネル・Bots・ルーティン）と「状態」（利用者の状態のグループ）の 2 通りに並べる。メインの面は替えない -->
    <div class="fchips" id="fchips"></div>
    <div class="filter-outside" id="filterOutside" hidden><span data-i18n="app.filterOutside"></span><button type="button" class="btn" id="clearFilterOutside" data-i18n="app.clearFilter"></button></div>
    <div class="res-head" id="resHead" hidden>
      <span class="res-count" id="resCount"></span><span class="res-arc" id="resArc"></span><span class="sp"></span>
      <button type="button" class="res-sort" id="resSort" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></svg><span></span></button>
    </div>
    <span class="sr-live" id="resLive" role="status" aria-live="polite"></span>
    <div class="groups" id="groups"></div>
    <!-- Bots・ルーティンの節の置き場（web/channels/sidebar.mjs が行を作る。行は .cs-row[data-kind][data-id]）。チャンネルの並べ方の間は、節ごと #groups の末尾へ移る（web/side.mjs の channelExtras）。チャンネルの節は使わない -->
    <div class="channels-side" id="channelsSide" hidden>
      <section class="cs-sec" data-sec="channels"><h2 data-i18n="channels:side.sections.channels"></h2><div class="cs-rows"></div></section>
      <section class="cs-sec" data-sec="bots"><h2 data-i18n="channels:side.sections.bots"></h2><div class="cs-rows"></div></section>
      <section class="cs-sec" data-sec="routines"><h2 data-i18n="channels:side.sections.routines"></h2><div class="cs-rows"></div></section>
    </div>
    <!-- 設定を開いている間、セッション一覧と入れ替わる。見出しと行は状態・セッションと同じ形 -->
    <nav class="settings-menu" id="settingsNav" data-i18n-aria-label="app.settings">
      <h2 data-i18n="app.settings"></h2>
      <button type="button" id="setupTab" aria-controls="setupPanel" data-i18n="settings.nav.agents"></button>
      <button type="button" id="apiKeysTab" aria-controls="apiKeysPanel" data-i18n="settings.nav.apiKeys"></button>
      <button type="button" id="usageTab" aria-controls="usagePanel" data-i18n="settings.nav.usage"></button>
      <button type="button" id="delegationTab" aria-controls="delegationPanel" data-i18n="settings.nav.delegation"></button>
      <button type="button" id="appearanceTab" aria-controls="appearancePanel" data-i18n="settings.nav.appearance"></button>
      <button type="button" id="inputTab" aria-controls="inputPanel" data-i18n="settings.nav.input"></button>
      <button type="button" id="openContext" aria-controls="contextPanel" data-i18n="settings.nav.context"></button>
      <button type="button" id="autoCompactionTab" aria-controls="autoCompactionPanel" data-i18n="settings.nav.autoCompaction"></button>
      <!-- 内蔵ブラウザー。デスクトップ版のホストの画面だけ出す（web/browser-settings.mjs） -->
      <button type="button" id="browserTab" aria-controls="browserPanel" data-i18n="settings.nav.browser" hidden></button>
      <button type="button" id="computerTab" aria-controls="computerPanel" data-i18n="settings.nav.computer"></button>
      <button type="button" id="notifyTab" aria-controls="notifyPanel" data-i18n="settings.nav.notify"></button>
      <button type="button" id="voiceTab" aria-controls="voicePanel" data-i18n="settings.nav.voice"></button>
      <button type="button" id="remoteTab" aria-controls="remotePanel" data-i18n="settings.nav.remote"></button>
      <!-- Pleiad Plus（web/plus-settings.mjs）。status.available === false のときは出さない -->
      <button type="button" id="plusTab" aria-controls="plusPanel" data-i18n="settings.nav.plus" hidden></button>
      <button type="button" id="updatesTab" aria-controls="updatesPanel" data-i18n="settings.nav.about"></button>
    </nav>
    <div class="pop" id="iconPop" hidden></div>
    <div class="update-notice" id="updateNotice" hidden><span id="updateNoticeText"></span><button type="button" class="btn" id="viewUpdateNotes" data-i18n="app.update.viewNotes"></button><button type="button" class="btn" id="dismissUpdateNotice" data-i18n="app.update.dismiss"></button></div>
    <div class="update-notice" id="updatePrompt" hidden>
      <span id="updatePromptText" role="status" aria-live="polite"></span>
      <progress id="updatePromptProgress" max="100" hidden data-i18n-aria-label="app.update.progress"></progress>
      <button type="button" class="btn" id="viewAvailableUpdate" data-i18n="app.update.view"></button>
      <button type="button" class="btn" id="deferUpdate" data-i18n="app.update.later"></button>
    </div>
    <!-- 更新で中断した会話が残っている間の一行（docs/design-system.md「中断と再開」）。× は閉じたときの最大の中断時刻を覚える -->
    <div class="side-undo resume-strip" id="resumeStrip" role="status" hidden>
      <span class="side-undo-text" id="resumeStripText"></span>
      <button type="button" class="btn" id="resumeAll" data-i18n="interrupt.resumeAll"></button>
      <button type="button" class="btn btn-icon side-undo-close" id="closeResumeStrip" data-i18n-title="interrupt.stripClose" data-i18n-aria-label="interrupt.stripClose"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <!-- 一覧にキーボードのフォーカスがある間だけ出る操作キーの一行（web/side.mjs）。読み上げには役割と aria-keyshortcuts で伝える -->
    <div class="key-hint" id="searchHint" hidden aria-hidden="true"><span><kbd>↑↓</kbd><span data-i18n="sidebar.search.keyHint.move"></span></span><span><kbd>Enter</kbd><span data-i18n="sidebar.search.keyHint.open"></span></span><span><kbd>Esc</kbd><span data-i18n="sidebar.search.keyHint.clear"></span></span></div>
    <div class="key-hint" id="keyHint" hidden aria-hidden="true"><span><kbd>↑↓</kbd><span data-i18n="sidebar.keyHint.move"></span></span><span><kbd>Enter</kbd><span data-i18n="sidebar.keyHint.open"></span></span><span><kbd>Shift+F10</kbd><span data-i18n="sidebar.keyHint.menu"></span></span><span><kbd>Ctrl+B</kbd><span data-i18n="sidebar.keyHint.sidebar"></span></span></div>
    <!-- 直前の操作を取り消す一行（グループの出入り・状態の移動）。操作したときだけ出る -->
    <div class="side-undo" id="sideUndo" role="status" hidden></div>
    <!-- 接続が切れた一行・トークンが古い案内の短い文（web/connection-status.mjs）。読み上げは #connLive だけ -->
    <div class="conn-lost" id="connLost" hidden></div>
    <!-- ログインが要るエージェントがあるときだけ。押すと設定メニューが開く -->
    <button type="button" class="conn-lost" id="authNeed" hidden></button>
  </aside>
  <!-- 狭い画面（700px 以下）で脇を引き出しにしている間だけ、会話の上に敷く幕。押すと閉じる（client.mjs の「脇の開閉」） -->
  <div class="side-veil" id="sideVeil" aria-hidden="true"></div>
  <!-- 通知の一覧の面（web/notification-inbox.mjs）。広い幅は脇の頭の下に浮くポップ、700px 以下は下からのシート（後ろに幕） -->
  <div class="nveil" id="notifVeil" aria-hidden="true" hidden></div>
  <div class="npop" id="notifPanel" hidden></div>

  <dialog class="onboarding-dialog" id="onboardingDialog" aria-labelledby="onboardingTitle">
    <div class="dialog-heading">
      <div>
        <h2 id="onboardingTitle" data-i18n="dialog.onboarding.title"></h2>
        <p class="onboarding-subtitle" data-i18n="dialog.onboarding.subtitle"></p>
      </div>
      <button type="button" class="btn btn-quiet" id="closeOnboarding" data-i18n="dialog.onboarding.later"></button>
    </div>
    <div id="onboardingAgentList" class="onboarding-agent-list" role="radiogroup" data-i18n-aria-label="dialog.onboarding.agents"></div>
    <div id="onboardingAuth" class="onboarding-auth"></div>
    <!-- 作業ディレクトリ（web/onboarding.mjs。既定はホーム）。デスクトップ版は OS のダイアログ、ブラウザー版は簡易ブラウザー -->
    <div class="onboarding-cwd" role="group" aria-labelledby="onboardingCwdLabel">
      <div class="onboarding-cwd-label" id="onboardingCwdLabel" data-i18n="dialog.onboarding.cwd"></div>
      <div class="onboarding-cwd-row">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span class="onboarding-cwd-path" id="onboardingCwdPath"></span>
        <button type="button" class="btn" id="onboardingCwdChoose" aria-describedby="onboardingCwdPath" data-i18n="composer.cwd.choose"></button>
      </div>
      <div class="cbrowse onboarding-browse" id="onboardingBrowse" hidden></div>
      <p class="onboarding-cwd-note" data-i18n="dialog.onboarding.cwdNote"></p>
      <p class="cerr" id="onboardingCwdError" role="alert"></p>
    </div>
    <p id="onboardingError" role="status" aria-live="polite"></p>
    <p id="onboardingLive" class="visually-hidden" role="status" aria-live="polite"></p>
    <div class="onboarding-actions">
      <small class="muted" data-i18n="dialog.onboarding.note"></small>
      <button type="button" class="btn btn-primary" id="completeSetup" data-i18n="dialog.onboarding.start"></button>
    </div>
  </dialog>

  <!-- ==================== 会話 ==================== -->
  <main>
    <header class="top">
      <!-- 脇を閉じている間だけ出る。閉じるボタンと同じ絵。名前（aria-label）は件数を入れて client.mjs が書く（web/open-sidebar-mark.mjs）。
           data-i18n-aria-label は置かない（訳し直しで件数の無い名前に戻るため） -->
      <button type="button" class="btn btn-icon side-toggle" id="openSidebar" data-shortcut="B" data-i18n-title="app.openSidebarTitle" aria-controls="sidebar" aria-keyshortcuts="Control+B"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9.5 4v16"/></svg></button>
      <!-- タイトルの列（docs/design-system.md「会話の頭（狭い画面）」）。題と、所属・出どころの行（#titleSub）。
           701px 以上は 1 行で、#titleSub（パンくず「# 一時チャット ›」）を題の左に置く。700px 以下は 2 行で、題の下に
           「# 一時チャット · ⇄ ホスト名」（モバイル版の殻。web/remote-badge.mjs）・「↖ 依頼元の会話」・「⇄ 端末の AI から」を弱い字で並べる -->
      <div class="title-col">
        <span class="title-field" id="titleField"><input id="titleEdit" data-i18n-placeholder="session.untitled" data-i18n-aria-label="session.titleLabel" autocomplete="off" disabled><button type="button" class="btn btn-icon" id="titleWand" data-i18n-title="session.titleWand" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></button></span>
        <div class="title-sub" id="titleSub">
          <!-- パンくず（一時チャットの会話のとき。押すと一時チャットの流れ。流れの右に並べているときは出さない） -->
          <button type="button" class="btn crumb-home" id="crumbHome" hidden data-i18n-title="channels:side.openHome"><span class="crumb-hash" aria-hidden="true">#</span><span data-i18n="channels:side.home"></span></button>
          <span class="crumb-sep" id="crumbSep" hidden aria-hidden="true">›</span>
          <button type="button" class="btn" id="parentChatEntry" hidden></button>
          <span class="remote-origin" id="remoteOriginLine" hidden></span>
        </div>
      </div>
      <!-- 右パネルを開くアイコンボタン（docs/design-system.md「会話の頭の行のアイコン」）。目次・プラグイン・内蔵ブラウザーの順に同じ大きさで並べる -->
      <!-- 会話内の検索（web/conversation-toc.mjs）。虫眼鏡で、開くのは目次のパネル（検索の欄にフォーカス）。発言がある会話でだけ出す。開くと右パネル（狭い画面は下からのシート） -->
      <button type="button" class="btn btn-icon" id="tocEntry" hidden aria-controls="filePreview" aria-expanded="false" aria-keyshortcuts="Control+F" data-shortcut="F" data-i18n-title="nav.toc.entry" data-i18n-aria-label="nav.toc.entry"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg></button>
      <!-- 会話の右パネル「この会話のプラグイン」の入口（web/session-context.mjs）。件数は title と名前にだけ入れ、「変更あり」は右上の点（web/header-entries.mjs）。
           data-i18n-aria-label は置かない（訳し直しで件数の無い名前に戻るため） -->
      <button type="button" class="btn btn-icon" id="contextEntry" data-i18n-title="session.context.entryTitle" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v4M15 3v4"/><path d="M6 7h12v3.5a6 6 0 0 1-12 0z"/><path d="M12 16.5V21"/></svg></button>
      <!-- 会話の右パネル「git」の入口（web/git-panel.mjs）。作業場所が git のときだけ出し、コミットしていない変更があれば右上の点。700px 以下では出さず「…」のメニューに入れる -->
      <button type="button" class="btn btn-icon" id="gitEntry" hidden aria-controls="filePreview" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.75" cy="5.4" r="2.4"/><circle cx="6.75" cy="18.6" r="2.4"/><circle cx="17.25" cy="8.1" r="2.4"/><path d="M6.75 7.8v8.4M17.25 10.5c0 3.3-2.4 4.35-5.4 4.8-2.85.45-5.1 1.05-5.1 2.1"/></svg></button>
      <!-- 統合ブラウザー（web/header-entries.mjs）。ホストではビューアと Chrome、リモートでは窓のある会話だけに出す。名前・title・開閉・状態の印は header-entries.mjs が書く -->
      <button type="button" class="btn btn-icon" id="browserEntry" hidden aria-controls="filePreview" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.5 3.9 5.5 3.9 9s-1.3 6.5-3.9 9c-2.6-2.5-3.9-5.5-3.9-9s1.3-6.5 3.9-9z"/></svg></button>
      <!-- 委譲された子の会話でだけ出す、依頼元の会話へ戻る口（子の会話は脇の一覧に出ない）。サブエージェント・タスク・裏のコマンドの一覧は会話末尾の「バックグラウンド N」 -->
      <!-- 端末の AI から任された会話の出どころ（⇄ 端末の AI から · 依頼元の会話の題）。依頼元の会話は端末にあるので、ここからは開かない -->
      <!-- この会話の操作（脇の行の右クリックと同じメニュー）。狭い画面・タッチのときだけ出す（脇が引き出しで隠れているため） -->
      <button type="button" class="btn btn-icon more-btn" id="sessionMore" hidden aria-haspopup="menu" data-i18n-title="session.more" data-i18n-aria-label="session.more"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
    </header>
    <!-- スマホのアプリで、最初の作業が終わったときの「離れていても知らせますか？」（web/mobile-notify.mjs）。ほかでは出ない -->
    <div class="notify-band" id="notifyBand" role="region" data-i18n-aria-label="settings.nav.notify" hidden></div>
    <!-- 稼働表示（考えている・経過時間）は会話の筋の末尾の節として client.mjs が描く。固定の帯は置かない -->
    <!-- 会話を包む入れ物。最新へ・地図（web/conversation-nav-view.mjs）を #log の外に重ねる -->
    <div class="log-frame" id="logFrame"><div id="log"><div class="thread" id="thread"></div></div></div>

    <form class="composer" id="composer">
      <!-- 入力欄の上の 1 本の帯: 左に文脈（メーター・予約・圧縮中・失敗）、右端にバックグラウンドの入口（web/background-chip.mjs）。折り返さない -->
      <div class="context-strip" id="contextStrip" hidden>
        <div class="context-meter-wrap" id="contextMeterWrap" hidden><button type="button" class="context-meter" id="contextMeter" aria-haspopup="menu" aria-expanded="false" aria-controls="contextMeterPop"></button>
          <div class="pop menu context-meter-pop" id="contextMeterPop" role="menu" data-i18n-aria-label="compaction.meterMenu" hidden>
            <button type="button" class="li" role="menuitem" id="meterCompact" data-i18n="compaction.compactNow"></button>
            <button type="button" class="li" role="menuitem" id="meterSettings" data-i18n="compaction.settings"></button>
          </div></div>
        <div class="context-strip-status" id="contextStripStatus"><span class="context-strip-text" id="contextStripText" role="status"></span></div>
        <!-- エージェントの使用量。文脈と同じ帯の札に置く -->
        <button type="button" class="usage-chip" id="usageChip" hidden aria-haspopup="dialog" aria-expanded="false" aria-controls="usagePop"></button>
        <div class="work-entry" id="workEntry" hidden><button type="button" class="strip-chip bg-chip" id="workEntryButton" aria-controls="workDialog"></button></div>
      </div>
      <!-- エージェントの Chrome の窓を引き継いでいる間の帯（web/chrome-control.mjs。ADR 0154） -->
      <div id="chromeBanner"></div>
      <div id="outbox" class="outbox" aria-live="polite" hidden></div>
      <div class="next-settings" id="nextSettings" role="status" hidden><div><b data-i18n="chat.next.title"></b><div id="nextSettingsText"></div><div class="next-behind" id="nextSettingsBehind" hidden></div><details class="next-handoff" id="nextHandoff" hidden></details></div><button type="button" class="btn" id="cancelSettings" data-i18n="chat.next.cancel"></button></div>
      <div class="settings-error" id="settingsError" role="alert"></div>
      <!-- 欄の上の一行（web/composer-wait.mjs）: 作成中の送信の予約「会話ができしだい送ります · 取り消す」、読み込みの失敗「… · もう一度読む」、設定を保存できなかった「… · 再試行 · 選び直す · 取り消す」 -->
      <div class="composer-note" id="composerNote" role="status" hidden></div>
      <!-- 接続の一行（脇が見えていないときだけ）と、トークンが古いときの案内（脇の幅によらず）。web/connection-status.mjs -->
      <div class="conn-note" id="connNote" hidden></div>
      <!-- 入力の箱（docs/design-system.md「入力欄と上端」）。1 つの角丸の面に
           字の欄（1 行から伸びる）→ チップと送信の行 を入れる。デスクトップもスマホも同じ。
           添付は字の欄の中の、置いた位置にある札だけで見せる（取り消し・外す・再試行も札の上。ADR 0252） -->
      <div class="cbox" id="cbox">
        <!-- 入力欄の `!`（web/shell-composer.mjs）。シェルの形の間だけ、欄の上に「シェル · 作業ディレクトリ · 文として送る」。使えない会話では理由の一行 -->
        <div class="shell-head" id="shellHead" hidden></div>
        <!-- 入力欄の先頭が / の間だけ出るスキル候補（web/slash-skills.mjs）。面は .clist と同じ。
             入力欄の箱（.cbox）の中に置き、すぐ上に浮かせる（「次のターンから適用」の帯には重ねる） -->
        <ul class="clist" id="skillList" role="listbox" data-i18n-aria-label="chat.composer.skills" hidden></ul>
        <!-- 字の欄。Markdown をその場で整える編集欄（web/md-editor.mjs、ADR 0060）。textarea と同じ窓口（value・selectionStart・placeholder など）を持つ -->
        <div id="prompt" data-i18n-aria-label="chat.composer.editorLabel" data-i18n-placeholder="chat.composer.placeholder" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="skillList"></div>
        <!-- 書けない待ち（会話を開いている・初めて接続するまで）。150ms を越えたら字の欄の上に重ねる（web/composer-wait.mjs） -->
        <div class="composer-busy" id="composerBusy" hidden><span class="composer-busy-text" id="composerBusyText"></span></div>
        <!-- 候補を選んだ直後だけ、引数の書き方を薄く出す -->
        <div class="slash-hint" id="slashHint"></div>
        <!-- 下書きを保存できなかった（700px 以下だけ。チップの行には入らないので、その上に一行で。広い幅は行の「保存済み」の位置に出す） -->
        <p class="draft-fail" id="draftFail" role="status" hidden><span id="draftFailText"></span><button type="button" class="btn draft-fail-retry" id="draftFailRetry" data-i18n="chat.draft.retry"></button></p>
        <div class="crow">
          <!-- 添付の + 。押すと添付の面（web/attach-menu.mjs）。開いている間は × に回る -->
          <button type="button" class="btn btn-icon attach-plus" id="attach" data-i18n-title="chat.composer.attach" data-i18n-aria-label="chat.composer.attach"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <input type="file" id="fileIn" multiple hidden>
          <!-- 入力欄の設定は 2 つのチップ（web/composer-controls.mjs、docs/design-system.md「入力欄の設定」）。
               誰が・どれだけ考えて・どこまで任せるか（エージェント・モデル・エフォート・アカウント・承認モード）と、どこで（作業ディレクトリ）。
               承認モードはモデルの面の下端の切り替えで選び、既定でないときだけモデルのチップに印を出す（ADR 0252）。
               2 つとも同じ書体・大きさ・太さ・高さ・余白・アイコン・▾。チップは実際に使う値を出す。中身は押すと上に浮く面で選ぶ。
               1 行に並べ、折り返さない。足りなければ作業ディレクトリ → モデル名の順に … で詰める（送信は常に右端） -->
          <button type="button" class="chip model" id="modelChip" aria-controls="modelPop"></button>
          <button type="button" class="chip folder" id="cwdChip" aria-controls="cwdPop"></button>
          <span class="crow-gap"></span>
          <!-- 下書きを保存できなかったときだけ、行の空きに「保存できませんでした · 再試行」。保存できている間は何も出さない。
               700px 以下では出さない（保存の失敗は上の #draftFail） -->
          <button type="button" class="btn draft-saved" id="draftSaved" aria-live="polite" hidden></button>
          <!-- 日時を指定した送信（編集で戻したもの）の時刻。× で外せばふつうの送信になる -->
          <span class="chip armed" id="armedChip" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span class="v" id="armedText"></span><button type="button" class="x" id="armedRemove" data-i18n-aria-label="schedule.armedRemove" data-i18n-title="schedule.armedRemove"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span>
          <!-- 接続先（互換の接続先）は宛先とモデルのチップの面の中で選ぶ -->
          <!-- 中断。狭い幅（480px 以下）では四角のアイコンだけにする -->
          <button type="button" class="btn btn-quiet abort" id="abort" hidden data-i18n-title="chat.composer.abort" data-i18n-aria-label="chat.composer.abort"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="4.5" width="15" height="15" rx="3"/></svg><span data-i18n="chat.composer.abort"></span></button>
          <!-- 再開。中断状態・走っていない・欄が空のときだけ、中断と同じ位置に（web/interrupt.mjs）。保留があれば「保留中の N 件を送って再開」。上限で止まった会話は再生の三角が時計・字は「◷ 2:30 に再開」に替わり、▾ から面が開く -->
          <button type="button" class="btn btn-quiet resume" id="resume" hidden data-i18n-title="interrupt.resume" data-i18n-aria-label="interrupt.resume"><svg class="i resume-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8a.8.8 0 0 0-1.2.7z"/></svg><svg class="i resume-clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span id="resumeLabel" data-i18n="interrupt.resume"></span><span id="resumeShort" class="resume-short" aria-hidden="true"></span></button>
          <button type="submit" class="btn btn-primary send" id="send" data-i18n-title="chat.composer.sendTitle" data-i18n-aria-label="chat.composer.sendTitle"><svg class="i i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></svg><svg class="i i-run" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8a.8.8 0 0 0-1.2.7z"/></svg></button>
          <!-- 送信の円の右の ▾。日時を指定して送る面（web/send-menu.mjs）。右クリック・長押し・Ctrl+Shift+Enter でも開く。480px 以下は出さない（長押しで下からシート） -->
          <button type="button" class="send-more" id="sendMore" aria-controls="sendPop" data-i18n-title="schedule.sendMoreTitle" data-i18n-aria-label="schedule.sendMore"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
        </div>
      </div>
      <!-- 中断中に字を書いたときだけ見える一行。書いていない間も高さは取っておく（.quiet） -->
      <div class="resume-note quiet" id="resumeNote" hidden data-i18n="interrupt.resumeNote"></div>
      <div class="resume-note" id="armedNote" hidden></div>
      <div class="pop cpop" id="cwdPop" role="dialog" data-i18n-aria-label="chat.composer.cwd" hidden></div>
      <div class="pop cpop" id="modelPop" role="dialog" data-i18n-aria-label="chat.composer.model" hidden></div>
      <div class="pop cpop send-pop" id="sendPop" role="menu" data-i18n-aria-label="schedule.menuTitle" hidden></div>
      <div class="send-veil" id="sendVeil" hidden></div>
    </form>
    <div class="pop usage-pop" id="usagePop" role="dialog" data-i18n-aria-label="usage.header.title" hidden></div>

    <!-- ==================== 設定（会話と入れ替わる。脇は settingsNav になる） ==================== -->
    <section class="settings-view" id="settingsView" aria-labelledby="setupTab">
      <div class="settings-content">
        <section id="usagePanel" data-i18n-aria-label="settings.nav.usage" hidden>
          <div class="usage-screen-head">
            <h3 data-i18n="settings.nav.usage"></h3>
            <button type="button" class="btn" id="refreshUsage" data-i18n="settings.usage.refresh"></button>
          </div>
          <div id="usageCards" aria-live="polite"></div>
        </section>
        <!-- 委譲先の自動選択。中身は web/delegation-settings.mjs が作る -->
        <section id="delegationPanel" data-i18n-aria-label="settings.nav.delegation" hidden></section>
        <section id="apiKeysPanel" data-i18n-aria-label="settings.nav.apiKeys" hidden></section>

            <div id="agentControls">

              <p id="authLive" class="visually-hidden" role="status" aria-live="polite"></p>

          <p id="updateHint"></p>
          <p id="updateLastChecked" hidden></p>
          <progress id="updateProgress" max="100" hidden data-i18n-aria-label="settings.updates.downloadProgress"></progress>

          <button type="button" class="btn btn-primary" id="installUpdate" hidden data-i18n="settings.updates.install"></button>

            <p data-i18n="settings.updates.confirmBody"></p>

              <button type="button" class="btn" id="cancelInstallUpdate" data-i18n="settings.updates.later"></button>
              <button type="button" class="btn btn-primary" id="confirmInstallUpdate" data-i18n="settings.updates.confirmInstall"></button>
            </div>
          </div>
          <p id="updateError" role="alert"></p>
          <div id="updatePreferences" hidden>
            <label><input type="checkbox" id="updateCheckAutomatic"><span data-i18n="settings.updates.autoCheck"></span></label>
            <label><input type="checkbox" id="updateBeta"><span data-i18n="settings.updates.beta"></span></label>
            <label><input type="checkbox" id="updateAutomatic"><span data-i18n="settings.updates.autoDownload"></span></label>          </div>
          <!-- 常駐（デスクトップ版だけ。web/resident-settings.mjs。設定 › リモートから移した。ADR 0239） -->
          <div id="residentSettings" hidden></div>
          <!-- 外の AI の MCP に pleiad mcp を登録する設定のコピー。ホストの画面だけ（app.cliSetup が通ったら出す。web/cli-setup.mjs、ADR 0090） -->
          <div id="cliSetup" hidden>
            <h3 data-i18n="settings.updates.mcpTitle"></h3>
            <div class="cli-setup-acts">
              <button type="button" class="btn" id="copyMcpJson" data-i18n="settings.updates.copyMcpJson"></button>
              <button type="button" class="btn" id="copyMcpClaude" data-i18n="settings.updates.copyMcpClaude"></button>
            </div>
          </div>
          <h3 data-i18n="settings.updates.releaseNotes"></h3><div id="releaseHistory"></div>
        </section>
        <section id="appearancePanel" hidden data-i18n-aria-label="settings.nav.appearance">
          <p data-i18n="settings.appearance.theme.description"></p>
          <div class="seg sec" id="themeSeg"><button type="button" data-theme="auto" data-i18n="settings.appearance.theme.auto"></button><button type="button" data-theme="light" data-i18n="settings.appearance.theme.light"></button><button type="button" data-theme="dark" data-i18n="settings.appearance.theme.dark"></button></div>
          <!-- 言語（docs/design-system.md「言語」）。文言は辞書から入れる（web/i18n.mjs の applyDom と client.mjs の paintLocale） -->
          <h3 data-i18n="settings.appearance.language.title"></h3>
          <p data-i18n="settings.appearance.language.description"></p>
          <div class="seg sec" id="localeSeg" role="group" data-i18n-aria-label="settings.appearance.language.title"><button type="button" data-locale="auto"></button><button type="button" data-locale="ja"></button><button type="button" data-locale="en"></button></div>
          <p class="locale-now" id="localeNow" role="status" aria-live="polite"></p>
        </section>
        <!-- 入力（↑ の呼び出し・次のメッセージの候補）。中身は web/input-settings.mjs が作る -->
        <section id="inputPanel" data-i18n-aria-label="settings.nav.input" hidden></section>
        <section id="contextPanel" data-i18n-aria-label="settings.nav.context" hidden></section>
        <section id="autoCompactionPanel" data-i18n-aria-label="settings.nav.autoCompaction" hidden>
          <div class="auto-compaction-settings">

              <label for="autoCompactionMin" data-i18n="compaction.minSize"></label>

            </section>
            <section class="mp-panel auto-compaction-minimum">
              <label for="autoCompactionDelegated" data-i18n="compaction.delegatedSize"></label>

              <p class="mp-note" data-i18n="compaction.delegatedHint"></p>

            <section class="mp-panel auto-compaction-agents">

        <!-- 中身は web/browser-settings.mjs が作る -->

  <!-- 画像を大きく見る（承認ではないので dialog でよい）。× と Esc と外側のクリックで閉じる。
       下端に所在（フルパスとコピー）と操作を並べる（docs/design-system.md「ファイルの操作」）。中身は web/client.mjs の openLightbox -->
  <dialog id="lightbox">
    <button type="button" class="btn btn-icon lb-close" data-close data-i18n-title="dialog.closeEsc"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <img alt="">
    <div class="lb-cap"></div>
    <div class="lb-foot">
      <div class="lb-path"><span class="lb-path-text"></span><button type="button" class="btn btn-icon lb-copy" data-i18n-title="files.menu.copyPath" data-i18n-aria-label="files.menu.copyPath"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>
      <button type="button" class="btn lb-panel" data-i18n="files.menu.openInPreview"></button>
      <span class="lb-gap"></span>
      <button type="button" class="btn lb-reveal" data-i18n="files.menu.revealFile" data-i18n-title="files.revealTitle"></button>
      <a class="btn lb-save" href="#" download data-i18n="files.menu.save"></a>
    </div>
  </dialog>

  <!-- バックグラウンド（サブエージェント・委譲したタスク・裏のコマンド）。左に一覧、右に詳細（docs/design-system.md「バックグラウンド」）。
       承認ではないので dialog でよい。詳細の中身（#workBody）は会話と同じ部品で描く -->
  <dialog id="workDialog" aria-labelledby="workTitle">
    <header>
      <strong id="workTitle" data-i18n="dialog.work.title"></strong>
      <span class="work-count" id="workCount"></span>
      <button type="button" class="btn" data-close data-i18n="dialog.close"></button>
    </header>
    <div class="work-split" id="workSplit">
      <nav class="work-list" id="workList" data-i18n-aria-label="dialog.work.listLabel"></nav>
      <section class="work-detail">
        <div class="work-dh" id="workHead"></div>
        <div id="workBody"></div>
      </section>
    </div>
  </dialog>

  <!-- 接続の状態の読み上げ（画面の外。切れた・戻った・案内・確かめた結果を 1 回ずつ）。web/connection-status.mjs -->
  <div class="visually-hidden" id="connLive" role="status"></div>

  <script type="module" src="/client.mjs"></script>
</body>
</html>
