apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Pleiad: the release build's version comes from CI (-PplyVersionCode / -PplyVersionName, docs/android-releases.md)
def plyVersionCode = (project.findProperty('plyVersionCode') ?: '1') as int
def plyVersionName = project.findProperty('plyVersionName') ?: '0.1.0'

// Pleiad Plus: the api base. Debug builds can override it with -PpleiadPlusApi (e.g. an emulator pointing at a
// local fake); the release build always uses the default.
def pleiadPlusApi = project.findProperty('pleiadPlusApi') ?: 'https://api.pleiad.dev'

// Pleiad: release signing comes from the environment; without PLY_ANDROID_KEYSTORE the release build stays unsigned
def plyKeystore = System.getenv('PLY_ANDROID_KEYSTORE')
if (plyKeystore) {
    ['PLY_ANDROID_KEYSTORE_PASSWORD', 'PLY_ANDROID_KEY_ALIAS', 'PLY_ANDROID_KEY_PASSWORD'].each {
        if (!System.getenv(it)) throw new GradleException("PLY_ANDROID_KEYSTORE is set but ${it} is empty")
    }
}

android {
    namespace = "dev.pleiad.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.pleiad.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode plyVersionCode
        versionName plyVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        if (plyKeystore) {
            release {
                storeFile file(plyKeystore)
                storeType 'PKCS12'
                storePassword System.getenv('PLY_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PLY_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PLY_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'PLUS_API', "\"${pleiadPlusApi}\""
        }
        release {
            if (plyKeystore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'PLUS_API', '"https://api.pleiad.dev"'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Pleiad: the remote protocol (Kotlin, pure JVM) and the host WebView's injection APIs
    implementation project(':remote-core')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    // Pleiad Plus: the sign-in page opens in a Custom Tab (docs/plus.md "Android")
    implementation "androidx.browser:browser:$androidxBrowserVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
