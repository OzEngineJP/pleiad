<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pleiad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The shell's own screen (docs/remote.md §8.2). Bundled in the app;
     no host ever serves it. Host UIs open in a separate WebView without this bridge. -->
<main id="list" class="shell">
  <header class="top"><i class="logo"></i><b data-t="hosts.title"></b>
    <button id="notifyOpen" class="ib push" type="button" data-t-label="notify.open"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 21h4"/></svg></button>
    <!-- Pleiad Plus: the signed-in account's initial; opens the account sheet (docs/plus.md "Android") -->
    <button id="plusAccount" class="acct" type="button" hidden></button></header>
  <div id="hosts" class="card list" role="list"></div>
  <p id="empty" class="weak" hidden data-t="hosts.empty"></p>
  <button id="add" class="add" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="hosts.add"></span></button>
  <!-- Pleiad Plus の入口（ログイン・状態の知らせ） -->
  <div id="plus" class="plus" hidden></div>
  <p class="foot weak" data-t="hosts.foot"></p>
  <p id="plain" class="foot weak" hidden data-t="hosts.notEncrypted"></p>
  <!-- Google Play asks for the privacy policy inside the app too (site/privacy/). An outside URL: Capacitor opens it in the browser -->
  <p class="weak legal"><a id="privacy" class="link" data-t="hosts.privacy" href="https://pleiad.dev/privacy/"></a></p>
</main>

<main id="pair" class="shell" hidden>
  <header class="top"><button id="pairBack" class="ib" type="button" data-t-label="common.back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b data-t="pair.title"></b></header>
  <section id="pairStart" class="card">
    <button id="scan" class="add" type="button"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg><span data-t="pair.scan"></span></button>
    <p id="scanNote" class="weak" hidden></p>
    <label class="lbl" for="code" data-t="pair.pasteLabel"></label>
    <textarea id="code" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" data-t-placeholder="pair.pastePlaceholder"></textarea>
    <button id="usePaste" class="btn" type="button" data-t="pair.add"></button>
  </section>
  <section id="pairConfirm" class="card" hidden>
    <p><span data-t="pair.confirmLead"></span> <b id="confirmName" class="mono"></b></p>
    <p class="weak"><span data-t="pair.relay"></span> <span id="confirmRelay" class="mono"></span></p>
    <p id="confirmKnown" class="weak" hidden data-t="pair.known"></p>
    <div class="acts"><button id="confirmYes" class="btn fill" type="button" data-t="pair.add"></button><button id="confirmNo" class="btn" type="button" data-t="common.cancel"></button></div>
  </section>
  <section id="pairWait" class="card" hidden>
    <p id="waitLead"></p>
    <div id="waitCode" class="code" aria-live="polite"></div>
    <p id="waitNote" class="weak center"></p>
    <button id="pairCancel" class="btn" type="button" data-t="common.cancel"></button>
  </section>
  <p id="pairError" class="error" role="alert" hidden></p>
  <p class="foot weak" data-t="pair.fullAccess"></p>
</main>

<!-- 離れていても届く通知の設定（ADR 0086）。設定は端末ごと。アプリの中だけの画面で、ホストは配らない -->
<main id="notify" class="shell" hidden>
  <header class="top"><button id="notifyBack" class="ib" type="button" data-t-label="common.back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><b data-t="notify.title"></b></header>
  <div class="grp"><div class="srow" data-row="enabled"><div class="tx" id="notifyMasterLabel" data-t="notify.master"></div><button class="sw" role="switch" aria-checked="false" aria-labelledby="notifyMasterLabel" data-opt="enabled"><i></i></button></div></div>
  <p id="notifyDenied" class="error" role="status" hidden><span data-t="notify.denied"></span> <button id="notifySystem" class="link" type="button" data-t="notify.openSettings"></button></p>
  <div class="lbl" data-t="notify.section"></div>
  <div class="grp dep">
    <div class="srow" data-row="reply"><div class="tx" id="nlReply" data-t="notify.reply"></div><button class="sw" role="switch" aria-checked="true" aria-labelledby="nlReply" data-opt="reply"><i></i></button></div>
    <div class="srow" data-row="failed"><div class="tx" id="nlFailed" data-t="notify.failed"></div><button class="sw" role="switch" aria-checked="true" aria-labelledby="nlFailed" data-opt="failed"><i></i></button></div>
    <div class="srow" data-row="done"><div class="tx"><span id="nlDone" data-t="notify.done"></span><small data-t="notify.doneSub"></small></div><button class="sw" role="switch" aria-checked="true" aria-labelledby="nlDone" data-opt="done"><i></i></button></div>
  </div>
  <div class="grp dep" style="margin-top:12px">
    <div class="srow" data-row="lockNames"><div class="tx" id="nlLock" data-t="notify.lockNames"></div><button class="sw" role="switch" aria-checked="false" aria-labelledby="nlLock" data-opt="lockNames"><i></i></button></div>
    <div class="srow" data-row="skipPc"><div class="tx" id="nlSkip" data-t="notify.skipPc"></div><button class="sw" role="switch" aria-checked="true" aria-labelledby="nlSkip" data-opt="skipPc"><i></i></button></div>
  </div>
  <p class="foot weak" data-t="notify.foot"></p>
</main>

<!-- Pleiad Plus のアカウントのシート（docs/plus.md "Android"） -->
<div id="acctSheet" class="sheetWrap" hidden>
  <div id="acctBack" class="sheetBack"></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="acctAvatar" class="acct big"></div>
    <div id="acctEmail" class="sheetMail"></div>
    <div id="acctProvider" class="weak" hidden></div>
    <button id="acctManage" class="btn" type="button" data-t="plus.manage"></button>
    <button id="acctLogout" class="btn" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span data-t="plus.logout"></span></button>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
